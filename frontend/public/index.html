<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title></title>
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/static/img/logo.ico">
  <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=287412af187e9ab1e98f3f160c7e58b8" type="text/javascript"></script>
   <script src="/static/tianditu/js/jquery-1.7.2.min.js"></script>
   <script src="/static/tianditu/js/d3.min.js" charset="utf-8"></script>
   <script src="/static/tianditu/js/D3SvgOverlay.js"></script>
   <script src="/static/tianditu/js/CarTrack.js"></script>
   <link href="https://vjs.zencdn.net/7.8.4/video-js.css" rel="stylesheet" />
   <script src="https://vjs.zencdn.net/7.8.4/video.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-flash/2.2.1/videojs-flash.min.js"></script>

   <!-- <script src="/static/vehicleVideo/flv1.5.0.min.js"></script> -->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 34%),
        radial-gradient(circle at bottom right, rgba(148, 163, 184, 0.18), transparent 28%),
        linear-gradient(135deg, #f8fafc 0%, #e2e8f0 58%, #dbeafe 100%);
      overflow: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease, transform 0.35s ease;
    }

    #loader-wrapper::before,
    #loader-wrapper::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    #loader-wrapper::before {
      width: 420px;
      height: 420px;
      top: -160px;
      right: -100px;
      background: rgba(191, 219, 254, 0.42);
      filter: blur(10px);
    }

    #loader-wrapper::after {
      width: 320px;
      height: 320px;
      left: -120px;
      bottom: -120px;
      background: rgba(226, 232, 240, 0.84);
    }

    #preloader {
      position: relative;
      z-index: 1;
      width: min(420px, calc(100vw - 48px));
      padding: 34px 30px 30px;
      border-radius: 28px;
      border: 1px solid rgba(226, 232, 240, 0.95);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 20px 54px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    .app-loader-kicker {
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.08em;
      color: #64748b;
    }

    .app-loader-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .app-loader-subtitle {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.7;
      color: #64748b;
    }

    .app-loader-spinner {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 28px auto 0;
      border-radius: 50%;
      border: 4px solid rgba(148, 163, 184, 0.18);
      border-top-color: #0f172a;
      border-right-color: rgba(37, 99, 235, 0.68);
      animation: app-loader-spin 0.9s linear infinite;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .app-loader-spinner::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: rgba(15, 23, 42, 0.22);
      border-left-color: rgba(37, 99, 235, 0.22);
      animation: app-loader-spin 1.4s linear infinite reverse;
    }

    @keyframes app-loader-spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px);
      pointer-events: none;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .login-form-input .el-input__inner{
        font-size: 16px !important;
        font-weight: 400 !important;
        height: 56px !important;
    }

.main-content {
   background-color: #F4F4F4;
   background-image: none !important;
}
  </style>
</head>

<body class="main-content">
  <div id="app">
   <div id="loader-wrapper">
     <div id="preloader">
       <p class="app-loader-kicker">系统启动中</p>
       <h1 class="app-loader-title" id="app-loader-title">一体化安全生产平台</h1>
       <p class="app-loader-subtitle">系统资源加载中，请稍候</p>
       <div class="app-loader-spinner" aria-hidden="true"></div>
     </div>
   </div>
 </div>
</body>
</html>
<script>
  (function () {
    var fallbackName = '一体化安全生产平台'
    var productName = (window.localStorage && window.localStorage.getItem('productName')) || fallbackName
    var titleNode = document.getElementById('app-loader-title')
    if (titleNode) {
      titleNode.textContent = productName
    }
    if (!document.title || document.title === '加载中...') {
      document.title = productName
    }
  })()
</script>
<script src="iconfont.js"></script>
